<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CineAdmin | Nuevo Horario</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Pacifico&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="../../css/base/base.css" />
    <link rel="stylesheet" href="../../css/cine/header.css" />
    <link rel="stylesheet" href="../../css/cine/card.css" />
    <link rel="stylesheet" href="../../css/cine/button.css" />
  </head>
  <body>
    <header class="header container">
      <a href="index.html" class="header__logo-text">Cine<span>Admin</span></a>
      <nav>
        <ul class="header__list-nav">
          <li class="header__link"><a href="index.html">Dashboard</a></li>
          <li class="header__link"><a href="lista_peliculas.html">Películas</a></li>
          <li class="header__link"><a href="lista_salas.html">Salas</a></li>
          <li class="header__link"><a href="lista_horarios.html">Horarios</a></li>
          <li class="header__link"><a href="lista_clientes.html">Clientes</a></li>
          <li class="header__link"><a href="lista_boletos.html">Boletos</a></li>
        </ul>
      </nav>
    </header>

    <main class="form-section container">
      <section class="card">
        <h1 class="card__title">Nuevo Horario</h1>
        <form class="flex flex--column" data-form>
          <div class="input-container">
            <select name="pelicula_id" id="pelicula_id" class="input" required data-pelicula>
              <option value="" disabled selected>Selecciona una película</option>
            </select>
            <label class="input-label" for="pelicula_id">Película</label>
            <span class="input-menssage-error">Este campo es requerido</span>
          </div>
          <div class="input-container">
            <select name="sala_id" id="sala_id" class="input" required data-sala>
              <option value="" disabled selected>Selecciona una sala</option>
            </select>
            <label class="input-label" for="sala_id">Sala</label>
            <span class="input-menssage-error">Este campo es requerido</span>
          </div>
          <div class="input-container">
            <input name="fecha" id="fecha" class="input" type="date" required data-fecha />
            <label class="input-label" for="fecha">Fecha</label>
            <span class="input-menssage-error">Este campo es requerido</span>
          </div>
          <div class="input-container">
            <input name="hora" id="hora" class="input" type="time" required data-hora />
            <label class="input-label" for="hora">Hora</label>
            <span class="input-menssage-error">Este campo es requerido</span>
          </div>
          <div class="input-container">
            <input name="precio" id="precio" class="input" type="number" placeholder="Precio (Bs.)" required min="0" step="0.01" data-precio />
            <label class="input-label" for="precio">Precio (Bs.)</label>
            <span class="input-menssage-error">Este campo es requerido</span>
          </div>
          <button type="submit" class="button">Registrar Horario</button>
        </form>
      </section>
    </main>

    <script type="module" src="../../controllers/cine/registrar_horario_controller.js"></script>
  </body>
</html>
