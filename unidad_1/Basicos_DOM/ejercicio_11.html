<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ejercicio 11 removechild</title>
</head>
<body>
    <div id="contenedor">
        <div id="eliminado">eliminar</div>
    </div>
    <script>
        const elemento_eliminar = document.getElementById("eliminado");
        const elementoPadre=elemento_eliminar;//identifica al elemento a eliminar padre
        elementoPadre.removeChild(elemento_eliminar); //elimina el elemento hijo del padre
    </script>
</body>
</html>
